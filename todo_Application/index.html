<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>To Do Application</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
  </head>
  <body>
    <header>
      <nav class="navbar bg-primary text-light px-5">
        <div class="navbar-brand text-light fw-bold">To-Do Application</div>
      </nav>
    </header>

    <main>
      <section class="container p-3 border rounded shadow mt-3 d-flex gap-4">
        <input
          type="text"
          name="task"
          id="taskInput"
          placeholder="Add your task"
          class="form-control"
        />
        <button class="btn btn-primary text-nowrap" onclick="addTask()">
          Add Your Task
        </button>


      </section>

      <section class="container p-3 border rounded shadow mt-3 d-flex gap-4">
        <ol class="w-100" id="taskList">
          <li class="p-3">
            <span>task 1</span>
            <button class="btn btn-danger btn-sm ms-3">Delete</button>
            <button class="btn btn-primary btn-sm ms-2">Edit</button>
          </li>
        </ol>

       <div class="text-end d-flex p-3">
        <button
            class="btn btn-danger text-nowrap btn-sm"
            onclick="clearAllTasks()">
            Clear All
        </button>
    </div>
      </section>
    </main>

    <!-- Script -->
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
    <script src="script.js"></script>
  </body>
</html>
