<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bootstrap</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
  </head>
  <body class="bg-black">
    <div class="text-center text-white fs-1">Hello World</div>

    <div class="p-3 mb-2 bg-danger text-white fs-2">.bg-danger</div>

    <div class="p-3 mb-2 bg-secondary text-white fs-3">.bg-secondary</div>

    <div class="p-3 mb-2 bg-primary text-white fs-4">.bg-primary</div>

    <div class="container mt-5">
      <div class="card mx-auto shadow-lg" style="max-width: 350px">
        <img
          src="https://picsum.photos/600/350"
          class="card-img-top"
          alt="Nature"
        />

        <div class="card-body p-4">
          <h3 class="card-title fw-bold">Explore Nature 🌿</h3>

          <p class="card-text text-secondary">
            Discover beautiful places and explore the world with amazing
            experiences.
          </p>

          <button class="btn btn-primary px-4">Explore Now</button>
        </div>
      </div>
    </div>

    <!-- Bootstrap Screen -->
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
