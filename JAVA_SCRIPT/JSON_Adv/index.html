<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <form id="loginForm">
      <div>
        <label for="userName">User Name</label>
        <input type="text" name="userName" id="userName" />
      </div>
      <div>
        <label for="password">Password</label>
        <input type="password" name="password" id="password" />
      </div>
      <div>
        <button type="submit">Submit</button>
      </div>
    </form>

    <hr><hr>
    <section>
      <form id="testform">
        <label for="fullName">Full Name :</label>
        <input
          type="text"
          name="fullName"
          id="fullName"
          placeholder="Your Name"
        />

        <br />
        <br />
        <label for="email">Email :</label>
        <input type="email" name="email" id="email" placeholder="Your email" />

        <br />
        <br />
        <label for="password">Password :</label>
        <input
          type="password"
          name="password"
          id="password"
          placeholder="Your password"
        />

        <br />
        <br />
        <label for="cfpassword">Confirm Password :</label>
        <input
          type="password"
          name="cfpassword"
          id="cfpassword"
          placeholder="Confirm your password"
        />

        <br />
        <br />
        <label for="dob">Date of Birth :</label>
        <input type="date" name="dob" id="dob" />

        <br />
        <br />
        <label for="tob">Time of Birth :</label>
        <input type="time" name="tob" id="tob" />

        <br />
        <br />
        <label for="joiningTime">Joining Time :</label>
        <input type="datetime-local" name="joiningTime" id="joiningTime" />

        <br /><br />
        <button type="submit">Submit test From</button>
      </form>
    </section>
    <script src="script.js"></script>
  </body>
</html>
