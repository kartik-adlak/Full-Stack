
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Dashboard</title>
    <link rel="stylesheet" href="style1.css">
</head>
<body>

    <div class="dashboard">
        <h1>Student Dashboard</h1>
        <p class="description">Manage your college activities easily.</p>

        <div class="notification-card">
            <h2>Assignment Reminder</h2>
            <p id="assignmentMessage">No new notification.</p>
            <button id="assignmentButton">Show Assignment</button>
        </div>

        <div class="notification-card">
            <h2>Attendance Status</h2>
            <p id="attendanceMessage">Check your attendance status.</p>
            <button id="attendanceButton">Check Attendance</button>
        </div>

        <div class="notification-card">
            <h2>Personalize Dashboard</h2>
            <p id="themeMessage">Change the dashboard appearance.</p>
            <button id="themeButton">Toggle Dark Mode</button>
        </div>

        <button id="clearButton" class="clear-button">
            Clear All Notifications
        </button>
    </div>

    <script src="script1.js"></script>
</body>
</html>
