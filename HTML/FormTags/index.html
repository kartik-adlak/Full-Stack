<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Basic Forms</title>
  </head>
  <body>

   <fieldset>
    <legend align="center">Basic Form</legend>
     <form>
      <label for="fullName">Full Name :</label>
      <input type="text" name="fname" id="fullName" placeholder="Your name" />

      <br />
      <br />

      <label for="email">Email :</label>
      <input type="email" name="email" id="email" placeholder="Your email" />

      <br>
      <br>

      <label for="password">Password :</label>
      <input
        type="password"
        name="password"
        id="password"
        placeholder="Your password"
      />

      <br>
      <br>

      <label for="password">Confirm Password :</label>
      <input
        type="password"
        name="cpassword"
        id="cpassword"
        placeholder="Confirm your password"
      />

      <br>
      <br>


      <label for="dob">date Of Birth :</label>
      <input type="date" name="dob" id="dob">

      <br>
      <br>
      
      <label for="tob">Time Of Birth :</label>
      <input type="time" name="tob" id="tob">

      <br>
      <br>

      
      <label for="joiningTime">Joining Time :</label>
      <input type="datetime-local" name="joiningTime" id="joiningTime">

      <br>
      <br>

      <label for="volume">Volume :</label>
      <input type="range" name="volume" id="volume" min="0" max="10" value="3">

      <br>
      <br>

      <label for="checkbox">Check Box :</label>
      <input type="checkbox" name="checkbox" id="checkbox">

      <br>
      <br>

      <label for="mobile">Mobile :</label>
      <input type="number" name="mobile" id="mobile">


      <br>
      <br>

      <label for="file">Select File :</label>
      <input type="file" name="file" id="file">

      <br>
      <br>

      <label for="color">Color :</label>
      <input type="color" name="color id="color">

      <br>
      <br>


      <label for="address">Address :</label>
      <textarea name="address" id="address"></textarea>

      <br>
      <br>

      <label for="course">Course :</label>
      <select name="course" id="course">
        <option value="">Select Course</option>
        <option value="btech">B.Tech</option>
        <option value="bba">BBA</option>
        <option value="mtech">M.Tech</option>
      </select>


      <br>
      <br>

      <label for="gender">Gender</label>
      <input type="radio" name="gender" id="male" value="male">
      <span>Male</span>
       <input type="radio" name="gender" id="female" value="female">
      <span>Female</span>
       <input type="radio" name="gender" id="others" value="others">
      <span>Others</span>


      <br>
      <br>

      <label for="skillset">Skill Set :</label>
      <input type="checkbox" name="skillset" id="java" value="java">
      <span>Java</span>
       <input type="checkbox" name="skillset" id="dsa" value="dsa">
      <span>DSA</span>
       <input type="checkbox" name="skillset" id="html" value="html">
      <span>HTML</span>
       <input type="checkbox" name="skillset" id="css" value="css">
      <span>CSS</span>
       <input type="checkbox" name="skillset" id="js" value="js">
      <span>JavaScript</span>

      <br>
      <br>

      <img src="https://images.unsplash.com/photo-1471899236350-e3016bf1e69e?q=80&w=1171&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D" alt="" width="300" height="250">
    


      <button>Submit</button>
    </form>
   </fieldset>

  </body>
</html>
