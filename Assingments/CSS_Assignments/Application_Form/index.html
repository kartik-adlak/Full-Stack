<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Application Form</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="main">

        <h2>APPLICATION FORM</h2>


        <form>
                

            <fieldset>

                <legend>Personal Details</legend>


                <div class="personal-outer">


                    <label for="fullname">
                        Applicant's Full Name
                    </label>

                    <div>

                        <select name="title">

                            <option value="">
                                --Select--
                            </option>

                            <option value="Mr">
                                Mr.
                            </option>

                            <option value="Mrs">
                                Mrs.
                            </option>

                            <option value="Miss">
                                Miss
                            </option>

                        </select>

                        <input
                            type="text"
                            id="fullname"
                            name="fullname"
                        >

                    </div>



                   

                    <label>
                        Care Of
                    </label>

                    <div>

                        <label for="parents">
                            Parents
                        </label>

                        <input
                            type="radio"
                            id="parents"
                            name="care"
                        >


                        <label for="guardian">
                            Guardian
                        </label>

                        <input
                            type="radio"
                            id="guardian"
                            name="care"
                        >

                    </div>



                   

                    <label for="father">
                        Father's Name
                    </label>

                    <div>

                        <select>

                            <option>
                                Mr.
                            </option>

                        </select>

                        <input
                            type="text"
                            id="father"
                            name="father"
                        >

                    </div>



                  

                    <label for="mother">
                        Mother's Name
                    </label>

                    <div>

                        <select>

                            <option>
                                Mrs.
                            </option>

                        </select>

                        <input
                            type="text"
                            id="mother"
                            name="mother"
                        >

                    </div>




                    <label>
                        Gender
                    </label>

                    <div>

                        <label for="male">
                            Male
                        </label>

                        <input
                            type="radio"
                            id="male"
                            name="gender"
                        >


                        <label for="female">
                            Female
                        </label>

                        <input
                            type="radio"
                            id="female"
                            name="gender"
                        >


                        <label for="others">
                            Others
                        </label>

                        <input
                            type="radio"
                            id="others"
                            name="gender"
                        >

                    </div>



              

                    <label for="dob">
                        Date of Birth
                    </label>

                    <div>

                        <input
                            type="date"
                            id="dob"
                            name="dob"
                        >

                    </div>



                 

                    <label for="marital">
                        Marital Status
                    </label>

                    <div>

                        <select
                            id="marital"
                            name="marital"
                        >

                            <option value="">
                                --Select--
                            </option>

                            <option>
                                Single
                            </option>

                            <option>
                                Married
                            </option>

                        </select>

                    </div>



                  

                    <label for="category">
                        Category
                    </label>

                    <div>

                        <select
                            id="category"
                            name="category"
                        >

                            <option value="">
                                --Select--
                            </option>

                            <option>
                                General
                            </option>

                            <option>
                                OBC
                            </option>

                            <option>
                                SC
                            </option>

                            <option>
                                ST
                            </option>

                        </select>

                    </div>



           

                    <label>
                        Handicapped
                    </label>

                    <div>

                        <label for="handicappedNo">
                            No
                        </label>

                        <input
                            type="radio"
                            id="handicappedNo"
                            name="handicapped"
                        >


                        <label for="handicappedYes">
                            Yes
                        </label>

                        <input
                            type="radio"
                            id="handicappedYes"
                            name="handicapped"
                        >

                    </div>



           

                    <label>
                        Ex-Serviceman
                    </label>

                    <div>

                        <label for="serviceNo">
                            No
                        </label>

                        <input
                            type="radio"
                            id="serviceNo"
                            name="service"
                        >


                        <label for="serviceYes">
                            Yes
                        </label>

                        <input
                            type="radio"
                            id="serviceYes"
                            name="service"
                        >

                    </div>



                    <!-- EWS -->

                    <label>
                        EWS
                    </label>

                    <div>

                        <label for="ewsNo">
                            No
                        </label>

                        <input
                            type="radio"
                            id="ewsNo"
                            name="ews"
                        >


                        <label for="ewsYes">
                            Yes
                        </label>

                        <input
                            type="radio"
                            id="ewsYes"
                            name="ews"
                        >

                    </div>



                    <!-- Religion -->

                    <label for="religion">
                        Religion
                    </label>

                    <div>

                        <select
                            id="religion"
                            name="religion"
                        >

                            <option value="">
                                --Select--
                            </option>

                            <option>
                                Hindu
                            </option>

                            <option>
                                Muslim
                            </option>

                            <option>
                                Sikh
                            </option>

                            <option>
                                Christian
                            </option>

                            <option>
                                Other
                            </option>

                        </select>

                    </div>


                </div>

            </fieldset>





    

            <fieldset>

                <legend>Contact Details</legend>


                <div class="contact-outer">


                    <label for="mobile">
                        Mobile Number
                    </label>

                    <input
                        type="tel"
                        id="mobile"
                        name="mobile"
                        maxlength="10"
                    >



                    <label for="email">
                        Email ID
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                    >



                    <label for="address1">
                        Address Line 1
                    </label>

                    <input
                        type="text"
                        id="address1"
                        name="address1"
                    >



                    <label for="address2">
                        Address Line 2
                    </label>

                    <input
                        type="text"
                        id="address2"
                        name="address2"
                    >



                    <label for="city">
                        City
                    </label>

                    <input
                        type="text"
                        id="city"
                        name="city"
                    >



                    <label for="state">
                        State
                    </label>

                    <select
                        id="state"
                        name="state"
                    >

                        <option value="">
                            --Select--
                        </option>

                        <option>
                            Madhya Pradesh
                        </option>

                        <option>
                            Maharashtra
                        </option>

                        <option>
                            Rajasthan
                        </option>

                        <option>
                            Uttar Pradesh
                        </option>

                    </select>



                    <label for="pincode">
                        Pin Code
                    </label>

                    <input
                        type="text"
                        id="pincode"
                        name="pincode"
                        maxlength="6"
                    >


                </div>

            </fieldset>





            <fieldset>

                <legend>Qualification Details</legend>


                <div class="qualification-outer">


                    <!-- Headings -->

                    <b>Sr. No.</b>

                    <b>Qualification</b>

                    <b>Board/University</b>

                    <b>Passing Year</b>

                    <b>Max Marks</b>

                    <b>Marks Obtain</b>

                    <b>Percentage</b>



                    <!-- Row 1 -->

                    <span>1</span>

                    <select name="qualification1">

                        <option value="">
                            --Select--
                        </option>

                        <option>
                            10th
                        </option>

                        <option>
                            12th
                        </option>

                        <option>
                            Diploma
                        </option>

                        <option>
                            Graduation
                        </option>

                    </select>


                    <input
                        type="text"
                        name="board1"
                    >

                    <input
                        type="number"
                        name="year1"
                    >

                    <input
                        type="number"
                        name="max1"
                    >

                    <input
                        type="number"
                        name="obtain1"
                    >

                    <input
                        type="number"
                        name="percentage1"
                    >



                    <!-- Row 2 -->

                    <span>2</span>

                    <select name="qualification2">

                        <option value="">
                            --Select--
                        </option>

                        <option>
                            10th
                        </option>

                        <option>
                            12th
                        </option>

                        <option>
                            Diploma
                        </option>

                        <option>
                            Graduation
                        </option>

                    </select>


                    <input
                        type="text"
                        name="board2"
                    >

                    <input
                        type="number"
                        name="year2"
                    >

                    <input
                        type="number"
                        name="max2"
                    >

                    <input
                        type="number"
                        name="obtain2"
                    >

                    <input
                        type="number"
                        name="percentage2"
                    >



                    <!-- Row 3 -->

                    <span>3</span>

                    <select name="qualification3">

                        <option value="">
                            --Select--
                        </option>

                        <option>
                            10th
                        </option>

                        <option>
                            12th
                        </option>

                        <option>
                            Diploma
                        </option>

                        <option>
                            Graduation
                        </option>

                    </select>


                    <input
                        type="text"
                        name="board3"
                    >

                    <input
                        type="number"
                        name="year3"
                    >

                    <input
                        type="number"
                        name="max3"
                    >

                    <input
                        type="number"
                        name="obtain3"
                    >

                    <input
                        type="number"
                        name="percentage3"
                    >



                    <!-- Row 4 -->

                    <span>4</span>

                    <select name="qualification4">

                        <option value="">
                            --Select--
                        </option>

                        <option>
                            10th
                        </option>

                        <option>
                            12th
                        </option>

                        <option>
                            Diploma
                        </option>

                        <option>
                            Graduation
                        </option>

                    </select>


                    <input
                        type="text"
                        name="board4"
                    >

                    <input
                        type="number"
                        name="year4"
                    >

                    <input
                        type="number"
                        name="max4"
                    >

                    <input
                        type="number"
                        name="obtain4"
                    >

                    <input
                        type="number"
                        name="percentage4"
                    >


                </div>

            </fieldset>





        

            <fieldset>

                <legend>Language Knowledge</legend>


                <div class="language-outer">


                    <b>Language</b>

                    <b>Reading</b>

                    <b>Writing</b>

                    <b>Spoken</b>



                 
                    <span>Hindi</span>

                    <input
                        type="checkbox"
                        name="hindiReading"
                    >

                    <input
                        type="checkbox"
                        name="hindiWriting"
                    >

                    <input
                        type="checkbox"
                        name="hindiSpoken"
                    >



         

                    <span>English</span>

                    <input
                        type="checkbox"
                        name="englishReading"
                    >

                    <input
                        type="checkbox"
                        name="englishWriting"
                    >

                    <input
                        type="checkbox"
                        name="englishSpoken"
                    >



                

                    <span>Urdu</span>

                    <input
                        type="checkbox"
                        name="urduReading"
                    >

                    <input
                        type="checkbox"
                        name="urduWriting"
                    >

                    <input
                        type="checkbox"
                        name="urduSpoken"
                    >


                </div>

            </fieldset>





            <fieldset>

                <legend>Identification Details</legend>


                <div class="identification-outer">


                    <label for="aadhaar">
                        Aadhaar Card Number
                    </label>

                    <input
                        type="text"
                        id="aadhaar"
                        name="aadhaar"
                        maxlength="12"
                    >



                    <label for="pan">
                        PAN Card Number
                    </label>

                    <input
                        type="text"
                        id="pan"
                        name="pan"
                        maxlength="10"
                    >



                    <label for="photo">
                        Upload Photo
                    </label>

                    <input
                        type="file"
                        id="photo"
                        name="photo"
                    >



                    <label for="signature">
                        Upload Signature
                    </label>

                    <input
                        type="file"
                        id="signature"
                        name="signature"
                    >


                </div>

            </fieldset>




            <!-- BUTTONS -->

            <div class="buttons">

                <button type="submit">
                    Submit
                </button>

                <button type="reset">
                    Back
                </button>

            </div>


        </form>




    </div>

</body>

</html>
