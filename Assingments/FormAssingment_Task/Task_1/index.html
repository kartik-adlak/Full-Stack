<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task 1</title>
</head>
<body>
   <br><br><br>

    <table
        border="1"
        width="400"
        cellpadding="10"
        cellspacing="0"
        align="center"
    >

        <tr>
            <td>

                <h1>Admin Login Page</h1>

                <form>

                    <table cellpadding="6">

                        <tr>
                            <td>
                                <label for="username">
                                    Username:
                                </label>
                            </td>

                            <td>
                                <input
                                    type="text"
                                    name="username"
                                    id="username"
                                   
                                >
                            </td>
                        </tr>

                        <tr>
                            <td>
                                <label for="password">
                                    Password:
                                </label>    
                            </td>

                            <td>
                                <input
                                    type="password"
                                    name="password"
                                    id="password"
                                >
                            </td>
                        </tr>

                        <tr>
                            <td colspan="2">

                                <button type="submit">
                                    Submit
                                </button>

                                <button type="reset">
                                    Reset
                                </button>

                            </td>
                        </tr>

                    </table>

                </form>

            </td>
        </tr>

    </table>
</body>
</html>
