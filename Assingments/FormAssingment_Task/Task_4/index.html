<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task 4</title>
</head>
<body>
    

     <br><br><br>

    <form>

        <table
            border="1"
            cellpadding="6"
            cellspacing="3"
            width="900"
            align="center"
        >

            <tr>
                <th colspan="4">
                    Registration Form
                </th>
            </tr>

           
            <tr>
                <td>Student Name</td>

                <td>
                    <input
                        type="text"
                        name="firstName"
                        id="firstName"
                        placeholder="First Name"
                       
                    >
                </td>

                <td>
                    <input
                        type="text"
                        name="middleName"
                        id="middleName"
                        placeholder="Middle Name"
                    >
                </td>

                <td>
                    <input
                        type="text"
                        name="lastName"
                        id="lastName"
                        placeholder="Last Name"
                  
                    >
                </td>
            </tr>

            <tr>
                <td>
                    <label for="fatherName">
                        Father's Name
                    </label>
                </td>

                <td>
                    <input
                        type="text"
                        id="fatherName"
                        name="fatherName"
                        placeholder="Enter your father's name"
                    >
                </td>

                <td>
                    <label for="motherName">
                        Mother's Name
                    </label>
                </td>

                <td>
                    <input
                        type="text"
                        id="motherName"
                        name="motherName"
                        placeholder="Enter your mother's name"
                    >
                </td>
            </tr>

           
            <tr>
                <td>
                    <label for="dateOfBirth">
                        Date of Birth
                    </label>
                </td>

                <td>
                    <input
                        type="date"
                        id="dateOfBirth"
                        name="dateOfBirth"
                    >
                </td>

                <td>Gender</td>

                <td>
                    <input
                        type="radio"
                        id="male"
                        name="gender"
                        value="Male"
                    >

                    <label for="male">Male</label>

                    <input
                        type="radio"
                        id="female"
                        name="gender"
                        value="Female"
                    >

                    <label for="female">Female</label>
                </td>
            </tr>

           >
            <tr>
                <td>Category</td>

                <td>
                    <input
                        type="radio"
                        id="general"
                        name="category"
                        value="General"
                    >

                    <label for="general">Gen</label>

                    <input
                        type="radio"
                        id="obc"
                        name="category"
                        value="OBC"
                    >

                    <label for="obc">OBC</label>

                    <input
                        type="radio"
                        id="scst"
                        name="category"
                        value="SC/ST"
                    >

                    <label for="scst">SC/ST</label>
                </td>

                <td>Handicapped</td>

                <td>
                    <label for="handicappedYes">Yes</label>

                    <input
                        type="radio"
                        id="handicappedYes"
                        name="handicapped"
                        value="Yes"
                    >

                    <label for="handicappedNo">No</label>

                    <input
                        type="radio"
                        id="handicappedNo"
                        name="handicapped"
                        value="No"
                    >
                </td>
            </tr>

            <tr>
                <td>Ex-Serviceman</td>

                <td>
                    <label for="servicemanYes">Yes</label>

                    <input
                        type="radio"
                        id="servicemanYes"
                        name="exServiceman"
                        value="Yes"
                    >

                    <label for="servicemanNo">No</label>

                    <input
                        type="radio"
                        id="servicemanNo"
                        name="exServiceman"
                        value="No"
                    >
                </td>

                <td>EWS</td>

                <td>
                    <label for="ewsYes">Yes</label>

                    <input
                        type="radio"
                        id="ewsYes"
                        name="ews"
                        value="Yes"
                    >

                    <label for="ewsNo">No</label>

                    <input
                        type="radio"
                        id="ewsNo"
                        name="ews"
                        value="No"
                    >
                </td>
            </tr>

         
            <tr>
                <td>
                    <label for="email">Email ID</label>
                </td>

                <td>
                    <input
                        type="email"
                        id="email"
                        name="email"
                    >
                </td>

                <td>
                    <label for="mobile">Mobile No.</label>
                </td>

                <td>
                    <input
                        type="tel"
                        id="mobile"
                        name="mobile"
                        maxlength="10"
                    >
                </td>
            </tr>

     
            <tr>
                <td>
                    <label for="state">State</label>
                </td>

                <td>
                    <select id="state" name="state">

                        <option value="">
                            Select any One
                        </option>

                        <option value="Madhya Pradesh">
                            Madhya Pradesh
                        </option>

                        <option value="Maharashtra">
                            Maharashtra
                        </option>

                        <option value="Rajasthan">
                            Rajasthan
                        </option>

                        <option value="Uttar Pradesh">
                            Uttar Pradesh
                        </option>

                    </select>
                </td>

                <td>
                    <label for="city">City</label>
                </td>

                <td>
                    <select id="city" name="city">

                        <option value="">
                            Select any One
                        </option>

                        <option value="Bhopal">Bhopal</option>
                        <option value="Betul">Betul</option>
                        <option value="Indore">Indore</option>
                        <option value="Jabalpur">Jabalpur</option>

                    </select>
                </td>
            </tr>

        
            <tr>
                <td>
                    <label for="photo">
                        Upload Photo
                    </label>
                </td>

                <td>
                    <input
                        type="file"
                        id="photo"
                        name="photo"
                        accept="image/*"
                    >
                </td>

                <td>
                    <label for="signature">
                        Upload Signature
                    </label>
                </td>

                <td>
                    <input
                        type="file"
                        id="signature"
                        name="signature"
                        accept="image/*"
                    >
                </td>
            </tr>

         
            <tr>
                <td colspan="4" align="center">

                    <button type="submit">
                        Submit
                    </button>

                </td>
            </tr>

        </table>

    </form>


      <p align="center">
      <a href="../formIndex.html">
        <b>← Back to Main Page</b>
      </a>
    </p>

</body>
</html>
